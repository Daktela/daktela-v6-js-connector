name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 18
          - 20
          - 22
          - 24
          - 26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install and test in Docker
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/app"
          --workdir /app
          --env CI=true
          node:${{ matrix.node }}-alpine
          sh -c "npm ci && npm test && npm run test:types"

  coverage:
    name: Coverage and package checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate coverage in Docker
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/app"
          --workdir /app
          --env CI=true
          node:22-alpine
          sh -c "npm ci && npm audit --omit=dev --audit-level=moderate && npm run test:coverage && npm run test:package"

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
